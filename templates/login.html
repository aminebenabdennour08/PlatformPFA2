{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <h3 class="text-center mb-4"><i class="fas fa-lungs me-2"></i>Connexion</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nom d'utilisateur</label>
                        <input type="text" name="username" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill">Se connecter</button>
                </form>
                <p class="text-center mt-3">Pas encore de compte ? <a href="{{ url_for('register') }}">Créer un compte</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
